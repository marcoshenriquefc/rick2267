name: Temporary Local Revision Model

on:
  pull_request:

permissions:
  contents: read

jobs:
  package-revision-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download current llama.cpp Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p revision-package/bin revision-package/model
          release_json=$(mktemp)
          curl --fail --location --retry 4 \
            'https://api.github.com/repos/ggml-org/llama.cpp/releases/latest' \
            --output "$release_json"
          asset_url=$(jq -r '.assets[] | select(.name | test("bin-ubuntu-x64\\.tar\\.gz$")) | .browser_download_url' "$release_json" | head -n 1)
          test -n "$asset_url"
          curl --fail --location --retry 4 "$asset_url" --output llama-bin.tar.gz
          mkdir -p llama-extracted
          tar -xzf llama-bin.tar.gz -C llama-extracted
          cli_path=$(find llama-extracted -type f -name 'llama-cli' | head -n 1)
          test -n "$cli_path"
          bin_dir=$(dirname "$cli_path")
          cp -a "$bin_dir"/. revision-package/bin/
          chmod +x revision-package/bin/llama-cli revision-package/bin/llama-server
          LD_LIBRARY_PATH="$PWD/revision-package/bin" revision-package/bin/llama-cli --version

      - name: Download Portuguese-capable instruction model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check huggingface_hub
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download, list_repo_files

          candidates = [
              'Qwen/Qwen2.5-1.5B-Instruct-GGUF',
              'bartowski/Qwen2.5-1.5B-Instruct-GGUF',
          ]
          selected = None
          selected_repo = None
          errors = []
          for repo in candidates:
              try:
                  files = list_repo_files(repo)
                  matches = [
                      f for f in files
                      if f.lower().endswith('.gguf')
                      and 'q4_k_m' in f.lower()
                      and 'mmproj' not in f.lower()
                  ]
                  if matches:
                      selected_repo = repo
                      selected = sorted(matches, key=len)[0]
                      break
              except Exception as exc:
                  errors.append(f'{repo}: {exc!r}')
          if not selected_repo or not selected:
              raise RuntimeError('No Q4_K_M model found. ' + ' | '.join(errors))

          downloaded = hf_hub_download(repo_id=selected_repo, filename=selected)
          target = Path('revision-package/model/revision-model.gguf')
          target.write_bytes(Path(downloaded).read_bytes())
          Path('revision-package/model/source.txt').write_text(
              f'{selected_repo}\n{selected}\n', encoding='utf-8'
          )
          print(selected_repo, selected, target.stat().st_size)
          PY

      - name: Package and split revision tools
        shell: bash
        run: |
          set -euo pipefail
          tar -czf local-revision-model.tar.gz revision-package
          sha256sum local-revision-model.tar.gz | tee local-revision-model.sha256
          split -b 350M local-revision-model.tar.gz local-revision-model.part-
          ls -lh local-revision-model.tar.gz local-revision-model.part-* revision-package/model/revision-model.gguf
          test -f local-revision-model.part-aa
          test -f local-revision-model.part-ab
          test -f local-revision-model.part-ac
          test -f local-revision-model.part-ad

      - name: Upload package checksum
        uses: actions/upload-artifact@v4
        with:
          name: local-revision-model-checksum
          path: local-revision-model.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload package part aa
        uses: actions/upload-artifact@v4
        with:
          name: local-revision-model-part-aa
          path: local-revision-model.part-aa
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload package part ab
        uses: actions/upload-artifact@v4
        with:
          name: local-revision-model-part-ab
          path: local-revision-model.part-ab
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload package part ac
        uses: actions/upload-artifact@v4
        with:
          name: local-revision-model-part-ac
          path: local-revision-model.part-ac
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload package part ad
        uses: actions/upload-artifact@v4
        with:
          name: local-revision-model-part-ad
          path: local-revision-model.part-ad
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
