name: Temporary Whisper Model

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper model
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin" \
            --output ggml-base-q5_1.bin
          test -s ggml-base-q5_1.bin
          sha256sum ggml-base-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-base-q5_1
          path: ggml-base-q5_1.bin
          if-no-files-found: error
          retention-days: 1
